name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Estático uma vez só; os testes ficam na matriz
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services/*/src libs/python/*/src

  # Um item por serviço e a lib comum, cada um com 70% de cobertura (RNF05);
  # quem cria serviço novo acrescenta aqui e no COV_TARGETS do Makefile
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, gateway, notification, monitoring, common]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make cov s=${{ matrix.service }}

  # MySQL real com docker/mysql/init via docker run, igual ao local (ADR-023);
  # services: do GitHub não aceita o bind mount dos scripts de init
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make db-test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web

  # Uma imagem por serviço: quem cria serviço novo acrescenta um item aqui
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            dockerfile: services/auth/Dockerfile
          - name: gateway
            dockerfile: services/gateway/Dockerfile
          - name: notification
            dockerfile: services/notification/Dockerfile
          - name: monitoring
            dockerfile: services/monitoring/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: veriditi-${{ matrix.name }}:ci
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
