name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # galera de backend, adicionem os testes aqui depois ( não ter não é opção )
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services/*/src libs/python/*/src
      - run: uv run pytest

  # galera de web, adicionem os testes aqui depois ( se for ter )
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/users/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .
