name: veriditi

x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-veriditi}
  DB_USER: ${DB_USER:-veriditi}
  DB_PASSWORD: ${DB_PASSWORD:?defina no .env}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina no .env}
      MYSQL_DATABASE: ${DB_NAME:-veriditi}
      MYSQL_USER: ${DB_USER:-veriditi}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  users-migrate:
    build: &users-build
      context: .
      dockerfile: services/users/Dockerfile
    environment: *db-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy

  users:
    build: *users-build
    restart: unless-stopped
    environment: *db-env
    ports:
      - "${USERS_PORT:-8001}:8000"
    depends_on:
      users-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      USERS_API_URL: http://users:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      users:
        condition: service_healthy

volumes:
  mysql-data:
