# Raiz do workspace Python (uv). Não é um pacote instalável:
# apenas agrupa os serviços e libs compartilhadas sob um único uv.lock.
[project]
name = "veriditi-workspace"
version = "0.0.0"
requires-python = ">=3.12"
# A raiz depende de todos os membros para que `uv sync` monte um único
# .venv de desenvolvimento com tudo instalado (editável).
dependencies = ["auth-service", "gateway-service", "notification-service", "veriditi-common"]

[tool.uv]
package = false

[tool.uv.sources]
auth-service = { workspace = true }
gateway-service = { workspace = true }
notification-service = { workspace = true }
veriditi-common = { workspace = true }

[tool.uv.workspace]
members = ["services/*", "libs/python/*"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/*/src", "libs/python/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.pytest.ini_options]
testpaths = ["services", "libs/python"]
# importlib: permite vários serviços terem tests/conftest.py sem colisão de nomes
# `mysql` fica fora do padrão; rode com `make db-test-contract`
addopts = "--import-mode=importlib -m 'not mysql'"
markers = ["mysql: precisa de um MySQL real com docker/mysql/init aplicado"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
