[project]
name = "auth-service"
version = "0.1.0"
description = "Serviço de Autenticação e Identidade (IAM) do Veriditi (RF01, RF02, RF03, RF06)."
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.1",
    "argon2-cffi>=23.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "sqlalchemy[asyncio]>=2.1.7",
    "structlog>=25.1.0",
    "uvicorn[standard]>=0.54.0",
    "veriditi-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]

[tool.uv.sources]
veriditi-common = { workspace = true }
