{% extends "_layout.html" %}
{% block title %}Bem-vindo(a) ao Veriditi{% endblock %}
{% block content %}
<p style="margin:0 0 16px;font-size:16px;">Olá, {{ name }}!</p>
<p style="margin:0 0 16px;font-size:16px;">Seu e-mail foi confirmado e sua conta no Veriditi está ativa.</p>
<p style="margin:0 0 16px;"><a href="{{ web_url }}/entrar" style="display:inline-block;padding:12px 20px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-size:16px;">Entrar no Veriditi</a></p>
<p style="margin:0;font-size:14px;">A partir de agora você pode registrar suas primeiras provas digitais.</p>
{% endblock %}
