[project]
name = "notification-service"
version = "0.1.0"
description = "Serviço de notificações (e-mail)"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.7",
    "uvicorn[standard]>=0.54.0",
    "veriditi-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

[tool.uv.sources]
veriditi-common = { workspace = true }
