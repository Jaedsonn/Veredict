[project]
name = "gateway-service"
version = "0.1.0"
description = "API Gateway: ponto de entrada único da web para os serviços internos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
    "veriditi-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_service"]

[tool.uv.sources]
veriditi-common = { workspace = true }
