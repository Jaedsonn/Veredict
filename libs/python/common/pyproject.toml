[project]
name = "veriditi-common"
version = "0.1.0"
description = "Infraestrutura compartilhada entre os serviços (config, banco, health)."
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.7",
    "structlog>=25.1.0",
    "tzdata>=2025.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veriditi_common"]
